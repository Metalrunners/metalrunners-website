<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鋼鐵鎂 Steel Mag — 跑友會</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

    :root {
      --bg: #0c0c0e;
      --surface: #141416;
      --surface-2: #1c1c1f;
      --border: rgba(255,255,255,0.06);
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --accent: #f5a623;
      --accent-dim: rgba(245,166,35,0.15);
      --accent-glow: rgba(245,166,35,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 40px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(12,12,14,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { display: flex; align-items: center; gap: 14px; }
    .nav-logo-img {
      height: 50px; width: 50px;
      object-fit: contain;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f5a623, #ffcc00, #f5a623, #ff8800);
      background-size: 300% 300%;
      animation: logoGradient 4s ease infinite;
      box-shadow:
        0 0 0 2px rgba(245,166,35,0.3),
        0 0 15px rgba(245,166,35,0.4),
        0 4px 12px rgba(0,0,0,0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .nav-logo-img:hover {
      transform: rotate(5deg) scale(1.08);
    }

    @keyframes logoGradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .nav-logo-text { font-size: 20px; font-weight: 900; color: var(--text); letter-spacing: 3px; -webkit-text-stroke: 1px #f5a623; text-shadow: 0 0 6px rgba(245,166,35,0.4); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500; letter-spacing: 1px; transition: color 0.3s; }
    .nav-links a:hover { color: var(--accent); }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 40px 60px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 900px;
      background: radial-gradient(ellipse, var(--accent-dim) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block;
      padding: 10px 24px;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      border-radius: 50px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 36px;
    }
    .hero-title {
      font-size: clamp(64px, 12vw, 140px);
      font-weight: 900;
      letter-spacing: 10px;
      line-height: 1;
      margin-bottom: 20px;
    }
    .hero-title .accent { color: var(--accent); }
    .hero-subtitle {
      font-size: 20px;
      color: var(--text-muted);
      letter-spacing: 5px;
      margin-bottom: 70px;
    }

    /* TEAM PHOTO & VIDEO — 垂直排列 */
    .hero-media-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0px;
      align-items: center;
      width: 100%;
      max-width: 800px;
    }
    .team-photo-wrapper {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16/9;
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 80px var(--accent-dim);
      background: var(--surface-2);
    }
    .team-photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .team-photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 16px;
      gap: 12px;
    }
    .team-photo-placeholder .icon { font-size: 48px; opacity: 0.5; }

    /* TEAM VIDEO */
    .team-video-wrapper {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16/9;
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 80px var(--accent-dim);
      background: var(--surface-2);
    }
    .team-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .team-video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 16px;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .team-video-placeholder:hover {
      background: rgba(245,166,35,0.05);
    }
    .team-video-placeholder .icon { font-size: 48px; opacity: 0.5; }

    /* VOLUME BAR — 嵌入視頻底部 */
    #video-volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      border-radius: 0 0 28px 28px;
      box-sizing: border-box;
    }

    #volume-icon {
      font-size: 18px;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      user-select: none;
    }

    #video-volume {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.3);
      outline: none;
      cursor: pointer;
    }
    #video-volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #video-volume::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(245,166,35,0.5);
    }

    #volume-label {
      font-size: 12px;
      color: #fff;
      min-width: 36px;
      text-align: right;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    /* 響應式 */
    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 13px; }
      .hero { padding: 100px 20px 40px; }
      .hero-badge { font-size: 12px; padding: 8px 16px; }
      .hero-title { letter-spacing: 5px; }
      .hero-subtitle { font-size: 16px; letter-spacing: 3px; margin-bottom: 50px; }
      .team-photo-wrapper, .team-video-wrapper { border-radius: 16px; }
      #video-volume-control { border-radius: 0 0 16px 16px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-logo">
      <img class="nav-logo-img" id="nav-logo" src="https://raw.githubusercontent.com/Metalrunners/metalrunners-website/main/nav-logo" alt="Logo">
      <span class="nav-logo-text">STEEL MAG</span>
    </div>
    <ul class="nav-links">
      <a href="#home">首頁</a>
      <a href="#about">關於我們</a>
      <a href="#members">成員</a>
      <a href="#funrun">周五熱血 FUN RUN</a>
      <a href="#upcoming-section">未來動向</a>
      <a href="#journal">日誌</a>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-badge">RUN · EAT · PLAY · FUN</div>
    <h1 class="hero-title">
      <span>鋼</span><span class="accent">鐵</span><span>鎂</span>
    </h1>
    <p class="hero-subtitle">STEEL MAG · 跑友會</p>

    <!-- 團體相 -->
    <div class="hero-media-wrapper">
      <div class="team-photo-wrapper">
        <img id="team-photo" src="https://raw.githubusercontent.com/Metalrunners/metalrunners-website/main/team-photo" alt="鋼鐵鎂跑友會團體照">
      </div>

      <!-- 團體影片 -->
      <div class="team-video-wrapper">
        <video id="team-video" autoplay muted loop playsinline></video>
        <div class="team-video-placeholder" id="team-video-placeholder">
          <span class="icon">🎬</span>
          <span>團體影片</span>
        </div>
        <!-- Volume Bar -->
        <div id="video-volume-control">
          <span id="volume-icon">🔇</span>
          <input type="range" id="video-volume" min="0" max="100" value="30">
          <span id="volume-label">30%</span>
        </div>
      </div>
    </div>
  </section>

  <script>
    // 影片控制
    const video = document.getElementById('team-video');
    const volumeSlider = document.getElementById('video-volume');
    const volumeIcon = document.getElementById('volume-icon');
    const volumeLabel = document.getElementById('volume-label');
    const videoPlaceholder = document.getElementById('team-video-placeholder');

    // 初始化音量
    video.volume = 0.3;

    // 音量控制
    volumeSlider.addEventListener('input', function() {
      const vol = this.value / 100;
      video.volume = vol;
      volumeLabel.textContent = this.value + '%';
      updateVolumeIcon(vol);
    });

    // 靜音切換
    volumeIcon.addEventListener('click', function() {
      if (video.muted) {
        video.muted = false;
        volumeSlider.value = video.volume * 100;
        volumeLabel.textContent = Math.round(video.volume * 100) + '%';
        updateVolumeIcon(video.volume);
      } else {
        video.muted = true;
        volumeIcon.textContent = '🔇';
        volumeLabel.textContent = '0%';
      }
    });

    function updateVolumeIcon(vol) {
      if (vol === 0) {
        volumeIcon.textContent = '🔇';
      } else if (vol < 0.3) {
        volumeIcon.textContent = '🔈';
      } else if (vol < 0.7) {
        volumeIcon.textContent = '🔉';
      } else {
        volumeIcon.textContent = '🔊';
      }
    }

    // 點擊 placeholder 上傳影片
    videoPlaceholder.addEventListener('click', function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'video/*';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          video.src = url;
          videoPlaceholder.style.display = 'none';
          video.style.display = 'block';
        }
      };
      input.click();
    });

    // 當影片載入完成後，隱藏 placeholder
    video.addEventListener('loadeddata', function() {
      if (video.src) {
        videoPlaceholder.style.display = 'none';
        video.style.display = 'block';
      }
    });
  </script>

</body>
</html>
