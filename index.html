<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鋼鐵鎂 Steel Mag — 跑友會</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
    :root {
      --bg: #0c0c0e;
      --surface: #141416;
      --surface-2: #1c1c1f;
      --border: rgba(255,255,255,0.06);
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --accent: #f5a623;
      --accent-dim: rgba(245,166,35,0.15);
      --accent-glow: rgba(245,166,35,0.4);
      --card-radius: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }
    /* Nav */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(20px); background: rgba(12,12,14,0.8); }
    .nav-logo { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 20px; }
    .nav-logo img { height: 40px; border-radius: 8px; }
    .nav-links { display: flex; gap: 32px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    /* Hero */
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding-top: 80px; }
    .hero-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0c0c0e 0%, #1a1a2e 100%); }
    .hero-bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 60%); opacity: 0.3; }
    .hero-content { position: relative; text-align: center; padding: 40px; }
    .hero-title { font-size: clamp(80px, 15vw, 200px); font-weight: 900; line-height: 0.9; margin-bottom: 24px; }
    .hero-title span { display: inline-block; background: linear-gradient(135deg, var(--accent) 0%, #ff6b35 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-sub { font-size: 18px; color: var(--text-muted); margin-bottom: 16px; }
    .hero-badge { display: inline-block; padding: 8px 24px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 100px; font-size: 14px; color: var(--accent); }
    /* Sections */
    section { padding: 120px 40px; max-width: 1200px; margin: 0 auto; }
    .section-label { font-size: 12px; letter-spacing: 4px; color: var(--accent); margin-bottom: 16px; }
    .section-title { font-size: 48px; font-weight: 900; margin-bottom: 48px; }
    /* About */
    .about-text { max-width: 800px; font-size: 18px; line-height: 1.8; color: var(--text-muted); }
    /* Team Grid */
    .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .member-card { background: var(--surface); border-radius: var(--card-radius); padding: 32px; text-align: center; border: 1px solid var(--border); transition: all 0.3s; }
    .member-card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 20px 40px rgba(245,166,35,0.1); }
    .member-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 3px solid var(--accent); }
    .member-logo { width: 60px; height: 60px; margin-bottom: 12px; }
    .member-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .member-title { font-size: 14px; color: var(--accent); margin-bottom: 16px; }
    .member-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .member-tag { padding: 4px 12px; background: var(--surface-2); border-radius: 100px; font-size: 12px; color: var(--text-muted); }
    /* Journal */
    .journal-list { display: flex; flex-direction: column; gap: 32px; }
    .journal-card { background: var(--surface); border-radius: var(--card-radius); padding: 32px; border: 1px solid var(--border); }
    .journal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .journal-title { font-size: 20px; font-weight: 700; }
    .journal-meta { font-size: 14px; color: var(--text-muted); display: flex; gap: 16px; }
    .journal-desc { color: var(--text-muted); line-height: 1.6; }
    /* Fun Run Carousel */
    .funrun-carousel { position: relative; height: 400px; border-radius: var(--card-radius); overflow: hidden; background: var(--surface); }
    .funrun-card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .funrun-card img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .funrun-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; z-index: 10; }
    .funrun-nav.prev { left: 20px; }
    .funrun-nav.next { right: 20px; }
    .funrun-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    .funrun-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; }
    .funrun-dot.active { background: var(--accent); }
    /* Team Photo */
    .team-photo-section { text-align: center; }
    .team-photo { max-width: 100%; border-radius: var(--card-radius); margin-bottom: 24px; }
    .team-caption { color: var(--text-muted); font-size: 18px; }
    /* Video */
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: var(--card-radius); }
    .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    /* Footer */
    footer { padding: 60px 40px; text-align: center; border-top: 1px solid var(--border); }
    .footer-brand { font-size: 24px; font-weight: 900; color: var(--accent); margin-bottom: 16px; }
    .footer-slogan { color: var(--text-muted); margin-bottom: 8px; }
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; min-height: 200px; color: var(--text-muted); }
    /* Responsive */
    @media (max-width: 768px) {
      section { padding: 80px 20px; }
      .hero-title { font-size: 60px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="nav-logo">
      <img id="nav-logo" src="" alt="Logo">
      <span id="nav-text">鋼鐵鎂</span>
    </div>
    <div class="nav-links">
      <a href="#about">認識我們</a>
      <a href="#members">成員</a>
      <a href="#journal">活動日誌</a>
      <a href="#funrun">FUN RUN</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <div class="hero-title">
        <span id="hero-t1">鋼</span><br>
        <span id="hero-t2">鎂</span>
      </div>
      <p class="hero-sub" id="hero-sub">優良的跑友魂 · 踏出鋼鐵意志</p>
      <div class="hero-badge" id="hero-badge">RUN · EAT · PLAY · FUN · REPEAT</div>
    </div>
  </section>

  <!-- About Section -->
  <section id="about">
    <div class="section-label" id="about-label">ABOUT US</div>
    <h2 class="section-title" id="about-title">用雙腳<br>寫下<br>熱血故事</h2>
    <div class="about-text">
      <p id="about-p1"></p>
      <br>
      <p id="about-p2"></p>
    </div>
  </section>

  <!-- Team Photo Section -->
  <section class="team-photo-section" id="team-photo">
    <div class="section-label" id="team-label">TEAM PHOTO</div>
    <img class="team-photo" id="team-photo-img" src="" alt="團體相片">
    <p class="team-caption" id="team-caption">每一個步伐，都是鋼鐵意志的見證</p>
  </section>

  <!-- Members Section -->
  <section id="members">
    <div class="section-label" id="members-label">METALS</div>
    <h2 class="section-title" id="members-title">認識金屬</h2>
    <div class="team-grid" id="members-grid">
      <!-- 成員卡片會動態生成 -->
    </div>
  </section>

  <!-- Fun Run Section -->
  <section id="funrun">
    <div class="section-label" id="funrun-label">FUN RUN</div>
    <h2 class="section-title">精彩瞬間</h2>
    <div class="funrun-carousel" id="funrun-carousel">
      <div class="loading">載入中...</div>
    </div>
    <div style="text-align:center;margin-top:24px;">
      <button class="funrun-nav prev" onclick="moveFunRun(-1)">&#10094;</button>
      <button class="funrun-nav next" onclick="moveFunRun(1)">&#10095;</button>
    </div>
  </section>

  <!-- Journal Section -->
  <section id="journal">
    <div class="section-label" id="journal-label">JOURNAL</div>
    <h2 class="section-title" id="journal-title">活動日誌</h2>
    <p id="journal-intro" style="color:var(--text-muted);margin-bottom:32px;"></p>
    <div class="journal-list" id="journal-list">
      <!-- 活動日誌會動態生成 -->
    </div>
  </section>

  <!-- Video Section -->
  <section id="video">
    <div class="section-label">VIDEO</div>
    <h2 class="section-title">團隊影片</h2>
    <div class="video-container">
      <video id="team-video" controls>
        <source id="video-source" src="" type="video/mp4">
        你的瀏覽器不支援影片播放
      </video>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-brand" id="footer-brand">鋼鐵鎂</div>
    <p class="footer-slogan" id="footer-slogan">踏出，鋼鐵意志</p>
    <p id="footer-sub">彼此扶持 互相勉勵 熱愛不滅 步履不停 快樂奔跑</p>
  </footer>

  <script>
    // ===== 從 GitHub 載入資料 =====
    const GITHUB_RAW = 'https://raw.githubusercontent.com/Metalrunners/metalrunners-website/main/';
    
    async function loadData() {
      try {
        const response = await fetch(GITHUB_RAW + 'data.json');
        const data = await response.json();
        
        // 圖片 URL 映射
        const imageUrls = data.__image_urls || {};
        const funrunUrls = data.__funrun_urls || {};
        
        // ===== 填充基本文字 =====
        document.getElementById('nav-text').textContent = data['text_nav-text'] || '鋼鐵鎂';
        document.getElementById('hero-t1').textContent = data['text_hero-t1'] || '鋼';
        document.getElementById('hero-t2').textContent = data['text_hero-t2'] || '鎂';
        document.getElementById('hero-sub').textContent = data['text_hero-sub'] || '';
        document.getElementById('hero-badge').textContent = data['text_hero-badge'] || '';
        
        document.getElementById('about-label').textContent = data['text_about-label'] || 'ABOUT US';
        document.getElementById('about-title').innerHTML = (data['text_about-title'] || '').replace(/\n/g, '<br>');
        document.getElementById('about-p1').textContent = data['text_about-p1'] || '';
        document.getElementById('about-p2').textContent = data['text_about-p2'] || '';
        
        document.getElementById('team-photo-img').src = imageUrls['team-photo.jpg'] || imageUrls['team-photo'] || '';
        document.getElementById('team-caption').textContent = data['text_team-caption'] || '';
        
        document.getElementById('members-label').textContent = data['text_members-label'] || 'METALS';
        document.getElementById('members-title').textContent = data['text_members-title'] || '認識金屬';
        
        document.getElementById('funrun-label').textContent = data['text_funrun-label'] || 'FUN RUN';
        
        document.getElementById('journal-label').textContent = data['text_journal-label'] || 'JOURNAL';
        document.getElementById('journal-title').textContent = data['text_journal-title'] || '活動日誌';
        document.getElementById('journal-intro').textContent = data['text_journal-intro'] || '';
        
        document.getElementById('footer-brand').textContent = data['text_footer-brand'] || '鋼鐵鎂';
        document.getElementById('footer-slogan').textContent = data['text_footer-slogan'] || '';
        document.getElementById('footer-sub').textContent = data['text_footer-sub'] || '';
        
        // ===== 導航 Logo =====
        document.getElementById('nav-logo').src = imageUrls['nav-logo.jpg'] || imageUrls['nav-logo.png'] || imageUrls['logo.jpg'] || '';
        
        // ===== 成員卡片 =====
        const members = ['ak', 'gang', 'juan', 'lu', 'ngan', 'sa', 'san', 'tung'];
        const membersGrid = document.getElementById('members-grid');
        membersGrid.innerHTML = '';
        
        members.forEach(m => {
          const name = data[`text_${m}-name`] || '';
          const title = data[`text_${m}-title`] || '';
          const tag1 = data[`text_${m}-tag1`] || '';
          const tag2 = data[`text_${m}-tag2`] || '';
          const avatar = imageUrls[`${m}-avatar.jpg`] || imageUrls[`${m}-avatar`] || '';
          const logo = imageUrls[`${m}-logo.jpg`] || imageUrls[`${m}-logo`] || '';
          
          if (name) {
            const card = document.createElement('div');
            card.className = 'member-card';
            card.innerHTML = `
              <img class="member-avatar" src="${avatar}" alt="${name}" onerror="this.style.display='none'">
              <img class="member-logo" src="${logo}" alt="logo" onerror="this.style.display='none'">
              <div class="member-name">${name}</div>
              <div class="member-title">${title}</div>
              <div class="member-tags">
                <span class="member-tag">${tag1}</span>
                <span class="member-tag">${tag2}</span>
              </div>
            `;
            membersGrid.appendChild(card);
          }
        });
        
        // ===== Fun Run 滾筒 =====
        initFunRunCarousel(funrunUrls, data.funrun_hidden_github);
        
        // ===== 活動日誌 =====
        initJournal(data);
        
        // ===== 團隊影片 =====
        const videoSrc = imageUrls['team-video.mp4'] || imageUrls['video_team-video'] || '';
        if (videoSrc && !videoSrc.startsWith('data:')) {
          document.getElementById('video-source').src = videoSrc;
          document.getElementById('team-video').load();
        }
        
        document.title = (data['text_nav-text'] || '鋼鐵鎂') + ' — Steel Mag';
        
      } catch (error) {
        console.error('載入資料失敗:', error);
        document.body.innerHTML = '<div class="loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;"><p style="color:var(--text-muted);">載入資料失敗</p><p style="color:var(--text-muted);font-size:14px;">請檢查網絡連接</p></div>';
      }
    }
    
    // ===== Fun Run 滾筒 =====
    let funRunIndex = 0;
    let funRunPhotos = [];
    let funRunInterval;
    
    function initFunRunCarousel(photos, hidden = []) {
      const carousel = document.getElementById('funrun-carousel');
      funRunPhotos = Object.values(photos);
      
      if (funRunPhotos.length === 0) {
        carousel.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:100px;">暫時未有相片</p>';
        return;
      }
      
      renderFunRunCard(0);
      startFunRunAuto();
    }
    
    function renderFunRunCard(index) {
      const carousel = document.getElementById('funrun-carousel');
      const total = funRunPhotos.length;
      
      carousel.innerHTML = `
        <img src="${funRunPhotos[index]}" alt="Fun Run ${index + 1}" style="max-width:100%;max-height:100%;object-fit:contain;">
      `;
    }
    
    function moveFunRun(dir) {
      funRunIndex = (funRunIndex + dir + funRunPhotos.length) % funRunPhotos.length;
      renderFunRunCard(funRunIndex);
      startFunRunAuto();
    }
    
    function startFunRunAuto() {
      clearInterval(funRunInterval);
      funRunInterval = setInterval(() => moveFunRun(1), 3000);
    }
    
    // ===== 活動日誌 =====
    function initJournal(data) {
      const journalList = document.getElementById('journal-list');
      const entries = [];
      
      // 收集所有 entry keys
      for (let i = 1; i <= 50; i++) {
        const key = `entry${String(i).padStart(3, '0')}`;
        const title = data[`text_${key}-title`];
        if (title && !title.includes('待填寫')) {
          entries.push({
            key,
            title,
            date: data[`text_${key}-date`] || '',
            location: data[`text_${key}-location`] || '',
            temp: data[`text_${key}-temp`] || '',
            weather: data[`text_${key}-weather`] || '',
            desc: data[`text_${key}-desc`] || '',
            link: data[`text_${key}-link`] || '',
            linkText: data[`text_${key}-link-text`] || ''
          });
        }
      }
      
      // 渲染
      entries.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'journal-card';
        card.innerHTML = `
          <div class="journal-header">
            <div class="journal-title">${entry.title}</div>
            <div class="journal-meta">
              ${entry.weather ? `<span>${entry.weather}</span>` : ''}
              ${entry.temp ? `<span>${entry.temp}</span>` : ''}
              ${entry.date ? `<span>${entry.date}</span>` : ''}
            </div>
          </div>
          <div class="journal-meta" style="margin-bottom:12px;">
            ${entry.location ? `<span>${entry.location}</span>` : ''}
          </div>
          <p class="journal-desc">${entry.desc}</p>
          ${entry.linkText ? `<a href="${entry.link}" target="_blank" style="color:var(--accent);margin-top:12px;display:inline-block;">${entry.linkText}</a>` : ''}
        `;
        journalList.appendChild(card);
      });
      
      if (entries.length === 0) {
        journalList.innerHTML = '<p style="color:var(--text-muted);">暫時未有活動記錄</p>';
      }
    }
    
    // ===== 啟動 =====
    loadData();
  </script>
</body>
</html>
